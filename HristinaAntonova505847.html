<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotus Lash School</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            color: white;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            max-width: 600px;
        }
        h1 {
            font-size: 72px;
            margin: 0 0 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .info {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: left;
        }
        .info-item {
            margin: 10px 0;
            font-size: 18px;
        }
        .label {
            font-weight: bold;
            color: #ffd700;
            display: inline-block;
            width: 180px;
        }
        .note {
            margin-top: 30px;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Lash Star</h1>
        <p>Страница участника конференции Lash Star Elite</p>

        <div class="info">
            <div class="info-item">
                <span class="label">Имя Участника:</span>
                <span>Hristina Antonova</span>
            </div>
            <div class="info-item">
                <span class="label">Конференция:</span>
                <span>Сильвер</span>
            </div>
            <div class="info-item">
                <span class="label">Чемпионат:</span>
                <span>3 номинации</span>
            </div>
            <div class="info-item">
                <span class="label">Гала Ужин:</span>
                <span>1.0</span>
            </div>
            <div class="info-item">
                <span class="label">FULL:</span>
                <span>F 8</span>
            </div>
            <div class="info-item">
                <span class="label">Conference:</span>
                <span>None</span>
            </div>
            <div class="info-item">
                <span class="label">Competition:</span>
                <span>None</span>
            </div>
        </div>

        <div class="note">
            <p>Эта информация только для участников конференции</p>
            <p>Отсканируйте QR-код для быстрого доступа</p>
        </div>
    </div>
</body>
</html>
