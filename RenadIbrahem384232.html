<!DOCTYPE html>
                <html lang="ru">
                <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Lotus Lash School</title>
                <style>
                    body {
                        font-family: Arial, sans-serif;
                        background: #ffffff;
                        min-height: 100vh;
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        margin: 0;
                        color: black;
                        text-align: center;
                    }
                    .card {
                        background: rgba(255, 255, 255, 0.1);
                        padding: 40px;
                        border-radius: 20px;
                        backdrop-filter: blur(10px);
                        box-shadow: 0 20px 40px rgba(0,0,0,0.2);
                        max-width: 600px;
                    }
                    h1 {
                        font-size: 72px;
                        margin: 0 0 20px 0;
                        text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
                    }
                    .info {
                        background: rgba(255, 255, 255, 0.2);
                        padding: 20px;
                        border-radius: 10px;
                        margin: 20px 0;
                        text-align: left;
                    }
                    .info-item {
                        margin: 10px 0;
                        font-size: 18px;
                    }
                    .label {
                        font-weight: bold;
                        color: #4e0008;
                        display: inline-block;
                        width: 180px;
                    }
                    .note {
                        margin-top: 30px;
                        font-size: 14px;
                        opacity: 0.8;
                    }
                </style>
                </head>
                <body>
                <div class="card">
                    <img src="logo.png" />
                    <p>Conference participant page</p>

                    <div class="info">
                        <div class="info-item">
                            <span class="label">Participant name:</span>
                            <span>Renad Ibrahem</span>
                        </div>
                        <div class="info-item">
                            <span class="label">Conference:</span>
                            <span>Голд</span>
                        </div>
                        <div class="info-item">
                            <span class="label">Championship:</span>
                            <span>3 номинации</span>
                        </div>
                        <div class="info-item">
                            <span class="label">Gala dinner:</span>
                            <span>1.0</span>
                        </div>
                        <div class="info-item">
                            <span class="label">FULL:</span>
                            <span>F 4</span>
                        </div>
                        <div class="info-item">
                            <span class="label">Conference:</span>
                            <span>None</span>
                        </div>
                        <div class="info-item">
                            <span class="label">Competition:</span>
                            <span>None</span>
                        </div>
                    </div>

                    <div class="note">
                        <p>This information is for conference participants only.</p>
                        <p>Scan the QR code for quick access</p>
                    </div>
                </div>
                </body>
                </html>
